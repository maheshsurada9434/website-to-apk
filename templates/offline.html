<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>You're offline</title>
<style>
:root{color-scheme:light dark;--bg:__BG__;--acc:__ACCENT__}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:#fff;font:16px/1.5 system-ui,-apple-system,Roboto,sans-serif;padding:24px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:28px 22px;max-width:380px;width:100%;text-align:center;backdrop-filter:blur(14px)}
svg{width:60px;height:60px;margin-bottom:6px}h1{font-size:22px;margin:4px 0 8px}p{opacity:.8;margin:0 0 20px}
button{width:100%;height:50px;border:0;border-radius:14px;background:var(--acc);color:#fff;font:600 16px system-ui}
</style></head>
<body><div class="card">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5.5 12.3a10 10 0 0 1 9.2-2.6"/><path d="M8.8 15.6a5 5 0 0 1 4.6-1.3"/><circle cx="12" cy="19" r="1"/><path d="M3 3l18 18"/></svg>
<h1>You're offline</h1><p>__NAME__ needs the internet right now. Check your mobile data or Wi-Fi.</p>
<button onclick="location.href='__URL__'">Try again</button></div>
<script>addEventListener('online',()=>location.href='__URL__')</script></body></html>
