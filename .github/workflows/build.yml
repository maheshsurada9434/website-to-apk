name: Build APK
on:
  push:
    branches: [main]
    paths: ['apps/**', 'scripts/**', 'native/**', 'templates/**', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      app:
        description: 'App folder to build (from apps/), or "all"'
        required: true
        default: all
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.p.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: p
        run: |
          ALL=$(ls apps)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.app }}" = "all" ] && LIST="$ALL" || LIST="${{ inputs.app }}"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^apps/' | cut -d/ -f2 | sort -u)
            # A change to the shared build scripts rebuilds every app
            if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qvE '^apps/'; then LIST="$ALL"; else LIST="$CHANGED"; fi
            [ -z "$LIST" ] && LIST="$ALL"
          fi
          echo "apps=$(printf '%s\n' $LIST | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build ${{ matrix.app }}
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          bash scripts/build-app.sh "${{ matrix.app }}" 2>&1 | tee build.log
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A="${{ matrix.app }}"
          NAME=$(node -p "require('./apps/$A/app.json').name"); V=$(node -p "require('./apps/$A/app.json').version || '1.0.0'")
          TAG="$A-v$V-build${{ github.run_number }}"
          MODE=$(grep '^mode:' dist/$A-info.txt | cut -d' ' -f2)
          NOTE="**$NAME** for Android. Download **$A.apk** on your phone and tap Install (allow installs from your browser if asked). Mode: $MODE."
          gh release create "$TAG" dist/$A.apk dist/$A-info.txt dist/$A-icon.png $(ls dist/$A.aab 2>/dev/null) --title "$NAME $V (build ${{ github.run_number }})" --notes "$NOTE" --target "${{ github.sha }}"
          # keep the 3 newest releases of this app
          gh release list --limit 100 --json tagName,createdAt -q "map(select(.tagName | startswith(\"$A-v\"))) | sort_by(.createdAt) | reverse | .[3:] | .[].tagName" | while read -r t; do [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag || true; done
      - name: Keep the build on the builds branch
        if: always()
        run: |
          A="${{ matrix.app }}"; mkdir -p /tmp/out/$A && cp dist/* /tmp/out/$A/ 2>/dev/null || true
          tail -n 300 build.log > /tmp/out/$A/build-log.txt 2>/dev/null || true
          echo "${{ job.status }} run ${{ github.run_number }}" > /tmp/out/$A/STATUS.txt
          cd /tmp/out && git init -q -b builds && git add -A
          git -c user.name="Mahesh Surada" -c user.email="36591838+maheshsurada9434@users.noreply.github.com" commit -qm "$A build ${{ github.run_number }} (${{ job.status }})"
          git fetch -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds 2>/dev/null && git merge -q --allow-unrelated-histories -X ours FETCH_HEAD -m merge 2>/dev/null || true
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:builds || git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:builds
